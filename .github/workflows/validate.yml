name: Validate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only presets/ may change
        if: github.event_name == 'pull_request' && github.event.pull_request.author_association != 'OWNER'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          outside=$(echo "$changed" | grep -v '^presets/' || true)
          if [ -n "$outside" ]; then
            echo "::error::This PR changes files outside presets/:"
            echo "$outside"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate presets
        run: python3 scripts/validate.py
